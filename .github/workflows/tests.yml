name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: pie
          coverage: none

      - name: Install libftdi
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libftdi1-dev libusb-1.0-0-dev pkg-config

      - name: Build ext-ftdi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo --preserve-env=GITHUB_TOKEN "$(command -v pie)" install php-io-extensions/ftdi:^0.10 --with-php-config="$(command -v php-config)"
          php --ri ftdi

      - name: Install Composer dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest
